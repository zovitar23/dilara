<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessiz Sayfalar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #1a0f26;
      --bg-2: #080512;
      --paper: #faf6fc;
      --paper-edge: #e6ddf1;
      --ink: #150b24;
      --muted: rgba(62, 45, 87, 0.65);
      --shadow: 0 45px 120px rgba(0, 0, 4, 0.85);
      --page-shadow: 0 25px 60px rgba(8, 6, 22, 0.4);
      --line: rgba(126, 98, 168, 0.25);
      --accent: #a389cc;
      --cyan: #6de2e6;
      --cyan-soft: rgba(109, 226, 230, 0.2);
      --glow-soft: rgba(200, 142, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Outfit", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 16%, rgba(142,232,234,0.08), transparent 18%),
        radial-gradient(circle at 78% 28%, rgba(168,118,232,0.13), transparent 30%),
        radial-gradient(circle at center, rgba(255,255,255,0.03), transparent 36%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(170, 132, 229, 0.08), transparent 42%),
        linear-gradient(90deg, rgba(142,232,234,0.03), rgba(0,0,0,0.08), rgba(170,132,229,0.04));
      opacity: 0.72;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(0, 0, 0, 0.08) 0.6px, transparent 0.8px),
        radial-gradient(rgba(255,255,255,0.03) 0.6px, transparent 0.8px);
      background-position: 0 0, 18px 14px;
      background-size: 24px 24px, 32px 32px;
      opacity: 0.2;
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: -2;
    }

    body > .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .ambient-glow::before,
    .ambient-glow::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.28;
      animation: bloomShift 16s ease-in-out infinite alternate;
    }

    .ambient-glow::before {
      width: 34vw;
      height: 34vw;
      min-width: 260px;
      min-height: 260px;
      top: 8%;
      left: 4%;
      background: radial-gradient(circle, rgba(155, 112, 220, 0.36), transparent 68%);
    }

    .ambient-glow::after {
      width: 28vw;
      height: 28vw;
      min-width: 220px;
      min-height: 220px;
      right: 8%;
      bottom: 6%;
      background: radial-gradient(circle, rgba(120, 228, 232, 0.18), transparent 70%);
      animation-duration: 19s;
    }

    .heart-rain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart-drop {
      position: absolute;
      top: -18vh;
      width: var(--size, 28px);
      height: var(--size, 28px);
      opacity: 0;
      transform: translate3d(0, 0, 0);
      animation: heartFall var(--duration, 16s) linear infinite;
      animation-delay: var(--delay, 0s);
      filter: blur(0.15px);
    }

    .heart-shape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .heart-shape path {
      fill: rgba(170, 132, 229, 0.18);
      stroke: rgba(185, 245, 247, 0.18);
      stroke-width: 1.4;
      filter: drop-shadow(0 0 12px rgba(170, 132, 229, 0.16));
    }

    .heart-drop.is-soft .heart-shape path {
      fill: rgba(170, 132, 229, 0.11);
      stroke: rgba(185, 245, 247, 0.09);
    }

    .heart-drop.is-strong .heart-shape path {
      fill: rgba(170, 132, 229, 0.24);
      stroke: rgba(185, 245, 247, 0.22);
    }

    .heart-core {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(216, 251, 251, 0.88);
      font-family: "Playfair Display", "Georgia", serif;
      font-size: calc(var(--size, 28px) * 0.34);
      font-style: italic;
      text-shadow: 0 0 8px rgba(185, 245, 247, 0.24);
      user-select: none;
      padding-top: 4%;
    }

    .heart-core span {
      transform: translateY(-2%);
    }

    .heart-drop.is-small .heart-core {
      font-size: calc(var(--size, 28px) * 0.38);
    }

    .heart-drop.is-large .heart-core {
      font-size: calc(var(--size, 28px) * 0.3);
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      position: relative;
      z-index: 1;
    }

    .layout {
      width: min(1000px, 100%);
      position: relative;
      transform: perspective(1600px) rotateX(1.4deg);
    }

    .book {
      position: relative;
      width: min(1000px, 100%);
      aspect-ratio: 1.5 / 1;
      min-height: 560px;
      max-height: min(82vh, 760px);
      background:
        linear-gradient(180deg, rgba(190, 240, 242, 0.04), rgba(0,0,0,0.12)),
        linear-gradient(180deg, rgba(96, 70, 136, 0.2), rgba(19, 15, 31, 0.4));
      border: 1px solid rgba(190, 240, 242, 0.08);
      border-radius: 8px;
      box-shadow: 0 30px 90px rgba(5, 3, 11, 0.58);
      overflow: hidden;
      isolation: isolate;
      transform: translateY(0);
      transition: transform 480ms ease, box-shadow 480ms ease, border-color 480ms ease;
    }

    .book:hover {
      transform: translateY(-6px);
      box-shadow: 0 38px 110px rgba(5, 3, 11, 0.62);
      border-color: rgba(190, 240, 242, 0.14);
    }

    .music-toggle,
    .admin-toggle {
      position: fixed;
      top: max(6px, env(safe-area-inset-top));
      z-index: 31;
      border: 1px solid rgba(190, 240, 242, 0.12);
      background:
        linear-gradient(180deg, rgba(146, 108, 201, 0.28), rgba(24, 18, 38, 0.84));
      color: rgba(235, 248, 248, 0.92);
      box-shadow: 0 0 0 1px rgba(173, 124, 228, 0.08), 0 10px 24px rgba(8, 5, 16, 0.34);
      cursor: pointer;
      font: inherit;
      display: grid;
      place-items: center;
      transition: transform 180ms ease, opacity 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      backdrop-filter: blur(8px);
    }

    .music-toggle {
      left: max(6px, env(safe-area-inset-left));
      min-width: 82px;
      height: 44px;
      border-radius: 999px;
      padding: 0 16px;
    }

    .love-counter {
      position: fixed;
      right: max(6px, env(safe-area-inset-right));
      bottom: max(6px, env(safe-area-inset-bottom));
      z-index: 31;
      padding: 14px 18px;
      min-width: 180px;
      border-radius: 18px;
      border: 1px solid rgba(190, 240, 242, 0.12);
      background:
        linear-gradient(180deg, rgba(146, 108, 201, 0.22), rgba(24, 18, 38, 0.86));
      box-shadow: 0 10px 28px rgba(8, 5, 16, 0.36);
      backdrop-filter: blur(10px);
      color: #efe8f5;
    }

    .love-counter-label {
      margin: 0 0 6px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(200, 241, 242, 0.74);
    }

    .love-counter-value {
      margin: 0;
      font-family: "Playfair Display", "Georgia", serif;
      font-size: 1.5rem;
      line-height: 1.1;
      color: #f8f3fd;
    }

    .love-counter-note {
      margin: 6px 0 0;
      font-size: 0.88rem;
      color: rgba(232, 222, 243, 0.74);
    }

    .admin-panel {
      position: fixed;
      top: 22px;
      right: 22px;
      width: min(340px, calc(100vw - 32px));
      min-height: 0;
      padding: 22px 18px;
      background:
        linear-gradient(180deg, rgba(190, 240, 242, 0.05), rgba(0,0,0,0.16)),
        linear-gradient(180deg, rgba(96, 70, 136, 0.22), rgba(19, 15, 31, 0.5));
      border: 1px solid rgba(190,240,242,0.08);
      border-radius: 10px;
      box-shadow: 0 30px 90px rgba(5, 3, 11, 0.42);
      color: #efe8f5;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(0.98);
      transition: opacity 220ms ease, transform 220ms ease, visibility 220ms ease;
    }

    .admin-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .admin-toggle {
      right: max(6px, env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border-radius: 999px;
    }

    .music-toggle:hover,
    .admin-toggle:hover {
      transform: translateY(-1px);
      border-color: rgba(190,240,242,0.24);
      box-shadow: 0 0 0 1px rgba(142, 232, 234, 0.12), 0 12px 28px rgba(8, 5, 16, 0.4);
    }

    .admin-panel h2 {
      margin: 0 0 6px;
      font-family: "Playfair Display", "Georgia", serif;
      font-size: 1.55rem;
      font-weight: 500;
      color: #f6f0fb;
    }

    .admin-text {
      margin: 0 0 18px;
      color: rgba(232, 222, 243, 0.74);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .admin-lock,
    .admin-editor {
      display: grid;
      gap: 12px;
    }

    .admin-editor[hidden] {
      display: none;
    }

    .admin-label {
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(200, 241, 242, 0.7);
    }

    .admin-input,
    .admin-select,
    .admin-textarea {
      width: 100%;
      border: 1px solid rgba(190,240,242,0.1);
      background: rgba(255,255,255,0.05);
      color: #f6f0fb;
      border-radius: 10px;
      padding: 12px 14px;
      font: inherit;
      outline: none;
    }

    .admin-input:focus,
    .admin-select:focus,
    .admin-textarea:focus {
      border-color: rgba(190,240,242,0.22);
      box-shadow: 0 0 0 3px rgba(142,232,234,0.08);
    }

    .admin-textarea {
      min-height: 148px;
      resize: vertical;
      line-height: 1.6;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 4px;
    }

    .admin-button {
      border: 1px solid rgba(190,240,242,0.1);
      background: rgba(173, 124, 228, 0.14);
      color: #f6f0fb;
      padding: 11px 14px;
      border-radius: 999px;
      font: inherit;
      cursor: pointer;
      transition: transform 180ms ease, opacity 180ms ease, border-color 180ms ease;
    }

    .admin-button:hover {
      transform: translateY(-1px);
      border-color: rgba(190,240,242,0.24);
    }

    .admin-status {
      min-height: 1.4em;
      font-size: 0.9rem;
      color: rgba(232, 222, 243, 0.78);
    }

    .book::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(170,132,229,0.08), transparent 44%),
        linear-gradient(90deg, rgba(190,240,242,0.05), transparent 48%, rgba(0,0,0,0.08));
      pointer-events: none;
    }

    .book::after {
      content: "";
      position: absolute;
      top: 3%;
      bottom: 3%;
      left: 18px;
      width: 3px;
      background: linear-gradient(180deg, transparent, rgba(28, 20, 44, 0.28), transparent);
      box-shadow: 2px 0 12px rgba(12, 9, 22, 0.16);
      pointer-events: none;
    }

    .book > .book-glow {
      position: absolute;
      inset: -12%;
      background:
        radial-gradient(circle at 50% 20%, rgba(173, 124, 228, 0.12), transparent 28%),
        radial-gradient(circle at 78% 84%, rgba(142, 232, 234, 0.08), transparent 18%);
      pointer-events: none;
      z-index: -1;
      filter: blur(18px);
    }

    .paper-texture {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 16%, rgba(132, 113, 161, 0.12), transparent 22%),
        radial-gradient(circle at 78% 70%, rgba(119, 204, 209, 0.08), transparent 20%),
        radial-gradient(circle at 35% 84%, rgba(255,255,255,0.1), transparent 20%);
      mix-blend-mode: multiply;
      opacity: 0.8;
      pointer-events: none;
    }

    .page-stack {
      position: absolute;
      inset: 12px 12px 74px 14px;
      perspective: 2000px;
    }

    .page {
      position: absolute;
      inset: 0;
      border-radius: 2px;
      background:
        linear-gradient(180deg, rgba(190,240,242,0.08), transparent 18%),
        linear-gradient(180deg, #f1ebf7, var(--paper));
      border: 1px solid var(--line);
      box-shadow: var(--page-shadow);
      padding: clamp(28px, 5vw, 54px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      transform-origin: left center;
      transition:
        transform 900ms cubic-bezier(0.2, 0.74, 0.18, 1),
        opacity 500ms ease,
        filter 900ms ease;
      backface-visibility: hidden;
      overflow: hidden;
      backdrop-filter: blur(1px);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(128, 109, 160, 0.12), transparent 20%),
        repeating-linear-gradient(
          180deg,
          transparent 0 38px,
          rgba(122, 114, 148, 0.05) 38px 39px
        ),
        radial-gradient(rgba(98, 88, 122, 0.05) 0.6px, transparent 0.8px);
      background-size: auto, auto, 18px 18px;
      opacity: 0.56;
      pointer-events: none;
    }

    .page::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 18%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(70, 56, 96, 0.1));
      opacity: 0;
      transition: opacity 500ms ease;
      pointer-events: none;
    }

    .page-flip-dust {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 28%, rgba(126, 98, 163, 0.12), transparent 20%),
        radial-gradient(circle at 74% 34%, rgba(142, 232, 234, 0.08), transparent 16%),
        radial-gradient(circle at 42% 62%, rgba(85, 64, 118, 0.08), transparent 18%),
        radial-gradient(circle at 58% 18%, rgba(82, 61, 115, 0.08) 0.8px, transparent 1px),
        radial-gradient(circle at 30% 72%, rgba(82, 61, 115, 0.08) 0.8px, transparent 1px),
        radial-gradient(circle at 82% 68%, rgba(82, 61, 115, 0.08) 0.8px, transparent 1px);
      background-size: auto, auto, auto, 16px 16px, 18px 18px, 20px 20px;
      mix-blend-mode: multiply;
      z-index: 2;
    }

    .page .page-corner {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 76px;
      height: 76px;
      background:
        linear-gradient(315deg, rgba(160, 144, 189, 0.24), rgba(255,255,255,0.04) 48%, transparent 49%);
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      opacity: 0.56;
      pointer-events: none;
    }

    .page-meta {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 20px;
      width: 100%;
    }

    .page-date {
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(92, 73, 122, 0.62);
      white-space: nowrap;
      padding-top: 2px;
    }

    .page-date .infinity {
      color: #6caeb4;
      padding-left: 4px;
    }

    .page.is-current::after {
      opacity: 1;
    }

    .page.is-flipping .page-flip-dust {
      animation: pageDust 700ms ease-out forwards;
    }

    .page.is-hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(0) rotateY(-178deg) scale(0.985);
      filter: blur(0.5px);
    }

    .page.is-next {
      opacity: 0;
      pointer-events: none;
      transform: translateX(16px) scale(0.985);
      filter: saturate(0.88) hue-rotate(6deg);
    }

    .page.is-current {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0) rotateY(0deg) scale(1);
      filter: none;
      z-index: 3;
      box-shadow: 0 18px 44px rgba(12, 9, 22, 0.24), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .page.is-prev {
      opacity: 0.14;
      pointer-events: none;
      transform: translateX(-8px) scale(0.99);
      z-index: 1;
    }

    .page-content {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      display: grid;
      gap: 24px;
      justify-items: start;
      padding-left: clamp(20px, 4vw, 54px);
      padding-right: clamp(18px, 3vw, 34px);
      padding-bottom: 58px;
    }

    .page-scribble {
      position: absolute;
      z-index: 1;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(1.15rem, 2vw, 1.7rem);
      color: rgba(109, 88, 146, 0.22);
      line-height: 1.1;
      pointer-events: none;
      transform: rotate(var(--rotate, -6deg));
      text-shadow: 0 0 1px rgba(255,255,255,0.12);
      white-space: pre-line;
    }

    .page-scribble.is-top {
      top: 12%;
      right: 7%;
      max-width: 18ch;
      text-align: right;
    }

    .page-scribble.is-bottom {
      left: 10%;
      bottom: 16%;
      max-width: 16ch;
    }

    .page-number {
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      position: relative;
      padding-bottom: 8px;
    }

    .page-number::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 52px;
      height: 1px;
      background: linear-gradient(90deg, rgba(141, 121, 169, 0.55), transparent);
    }

    .quote {
      margin: 0;
      font-family: "Playfair Display", "Georgia", serif;
      font-style: normal;
      font-weight: 500;
      line-height: 1.34;
      font-size: clamp(2rem, 4.4vw, 4rem);
      letter-spacing: 0;
      text-wrap: pretty;
      max-width: 18ch;
      text-shadow: 0 1px 0 rgba(255,255,255,0.26);
      position: relative;
    }

    .quote::first-letter {
      color: #76589b;
    }

    .note {
      font-family: "Playfair Display", "Georgia", serif;
      font-size: clamp(1.3rem, 2vw, 2rem);
      font-style: italic;
      line-height: 1.4;
      max-width: 28ch;
      color: var(--ink);
    }

    .signature-image {
      width: clamp(272px, 38.4vw, 464px);
      height: auto;
      display: block;
      object-fit: contain;
      opacity: 0.92;
      filter: grayscale(1) brightness(0.22) sepia(1) hue-rotate(235deg) saturate(1.2);
      margin-left: -18px;
      justify-self: start;
      transition: transform 300ms ease, opacity 300ms ease, filter 300ms ease;
    }

    .page.is-current .signature-image {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      z-index: 5;
      transform: translateX(-50%);
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 26px rgba(10, 8, 22, 0.1);
    }

    .control-arrow {
      border: 0;
      background: transparent;
      color: #51406d;
      width: 56px;
      height: 56px;
      font: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      line-height: 1;
      opacity: 0.7;
      text-shadow: 0 0 10px rgba(142, 232, 234, 0.12);
      transition: transform 220ms ease, opacity 220ms ease, color 220ms ease;
    }

    .control-arrow:hover {
      transform: translateY(-2px);
      opacity: 1;
      color: #3c7f8d;
    }

    .control-arrow:disabled {
      opacity: 0.24;
      cursor: default;
      transform: none;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        padding: 16px;
      }

      .layout {
        width: 100%;
        transform: none;
      }

      .book {
        min-height: 100svh;
        max-height: none;
        aspect-ratio: auto;
        border-radius: 8px;
      }

      .admin-panel {
        top: 70px;
        right: 16px;
        left: 16px;
        width: auto;
      }

      .love-counter {
        left: auto;
        right: max(4px, env(safe-area-inset-right));
        bottom: max(4px, env(safe-area-inset-bottom));
        min-width: 164px;
      }

      .page-stack {
        inset: 12px 12px 78px;
      }

      .page {
        padding: 28px 22px;
      }

      .controls {
        bottom: 14px;
        padding: 4px 12px;
      }

      .control-arrow {
        width: 48px;
        height: 48px;
        font-size: 1.55rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: 0ms !important;
      }
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(0, -20px, 0) scale(1.03);
      }

      try {
        await backgroundMusic.play();
        musicToggle.textContent = "Durdur";

      }

    function playPageFlip() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const duration = 0.42;
      const sampleRate = audioContext.sampleRate;
      const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < data.length; i += 1) {
        const t = i / data.length;
        const noise = (Math.random() * 2 - 1);
        const flutter = Math.sin(t * Math.PI * 10) * 0.12;
        const envelope =
          Math.exp(-t * 7.5) * 0.12 +
          Math.exp(-Math.pow((t - 0.22) / 0.11, 2)) * 0.09 +
          Math.exp(-Math.pow((t - 0.34) / 0.08, 2)) * 0.05;

        data[i] = (noise + flutter) * envelope;
      }

      const source = audioContext.createBufferSource();
      const lowpass = audioContext.createBiquadFilter();
      const highpass = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();

      source.buffer = buffer;
      highpass.type = "highpass";
      highpass.frequency.value = 320;
      highpass.Q.value = 0.7;

      lowpass.type = "lowpass";
      lowpass.frequency.value = 2100;
      lowpass.Q.value = 0.5;

      const now = audioContext.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      source.connect(highpass);
      highpass.connect(lowpass);
      lowpass.connect(gain);
      gain.connect(audioContext.destination);
      source.start(now);
      source.stop(now + duration);
    }

    function goToPage(nextIndex) {
      if (nextIndex === currentIndex || nextIndex < 0 || nextIndex >= quotes.length) return;
      const currentPage = pageStack.querySelector(".page.is-current");
      if (currentPage) {
        currentPage.classList.remove("is-flipping");
        void currentPage.offsetWidth;
        currentPage.classList.add("is-flipping");
      }
      currentIndex = nextIndex;
      updateBook();
      playPageFlip();
      syncEditorFields();
    }

    function populatePageSelect() {
      pageSelect.innerHTML = quotes
        .map((_, index) => `<option value="${index}">Sayfa ${index + 1}</option>`)
        .join("");
    }

    function syncEditorFields() {
      if (adminEditor.hidden) return;
      pageSelect.value = String(currentIndex);
      quoteInput.value = quotes[currentIndex].quote;
      authorInput.value = quotes[currentIndex].note;
    }

    function saveQuotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    }

    function getDefaultEntry(index) {
      return defaultQuotes[index] ? { ...defaultQuotes[index] } : { ...BLANK_PAGE };
    }

    function renderPages() {
      pageStack.innerHTML = "";

      quotes.forEach((entry, index) => {
        const page = document.createElement("article");
        page.className = "page";
        const scribble = pageScribbles[index];

        if (index < currentIndex) {
          page.classList.add("is-hidden");
        } else if (index === currentIndex) {
          page.classList.add("is-current");
        } else if (index === currentIndex + 1) {
          page.classList.add("is-next");
        } else {
          page.classList.add("is-prev");
        }

        page.innerHTML = `
          <div class="page-content">
            <div class="page-meta">
              <div class="page-number">${index + 1} / ${quotes.length}</div>
              <div class="page-date">${PAGE_DATE_LABEL} <span class="infinity">∞</span></div>
            </div>
            <blockquote class="quote">“${entry.quote}”</blockquote>
            <img class="signature-image" src="signature-z.png" alt="İmza">
            <div class="controls" aria-label="Sayfa kontrolleri">
              <button class="control-arrow prev-inline" type="button" data-nav="prev" aria-label="Önceki sayfa">←</button>
              <button class="control-arrow next-inline" type="button" data-nav="next" aria-label="Sonraki sayfa">→</button>
            </div>
          </div>
          ${scribble ? `<div class="page-scribble is-${scribble.position}" style="--rotate:${scribble.rotate}">${scribble.text}</div>` : ""}
          <div class="page-flip-dust" aria-hidden="true"></div>
          <div class="page-corner" aria-hidden="true"></div>
        `;

        pageStack.appendChild(page);
      });

      pageStack.querySelectorAll("[data-nav='prev']").forEach((button, index) => {
        button.addEventListener("click", () => {
          if (currentIndex === index) {
            goToPage(currentIndex - 1);
          }
        });
      });

      pageStack.querySelectorAll("[data-nav='next']").forEach((button, index) => {
        button.addEventListener("click", () => {
          if (currentIndex === index) {
            goToPage(currentIndex + 1);
          }
        });
      });
    }

    function updateBook() {
      const pages = pageStack.querySelectorAll(".page");

      pages.forEach((page, index) => {
        page.classList.remove("is-hidden", "is-current", "is-next", "is-prev");

        if (index < currentIndex) {
          page.classList.add("is-hidden");
        } else if (index === currentIndex) {
          page.classList.add("is-current");
        } else if (index === currentIndex + 1) {
          page.classList.add("is-next");
        } else {
          page.classList.add("is-prev");
        }
      });

      const prevButtons = pageStack.querySelectorAll("[data-nav='prev']");
      const nextButtons = pageStack.querySelectorAll("[data-nav='next']");

      prevButtons.forEach((button, index) => {
        button.disabled = index !== currentIndex || currentIndex === 0;
      });

      nextButtons.forEach((button, index) => {
        button.disabled = index !== currentIndex || currentIndex === quotes.length - 1;
      });
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" && currentIndex < quotes.length - 1) {
        goToPage(currentIndex + 1);
      }

      if (event.key === "ArrowLeft" && currentIndex > 0) {
        goToPage(currentIndex - 1);
      }
    });

    let touchStartX = 0;
    pageStack.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    pageStack.addEventListener("touchend", (event) => {
      const deltaX = event.changedTouches[0].clientX - touchStartX;
      if (deltaX < -40 && currentIndex < quotes.length - 1) {
        goToPage(currentIndex + 1);
      }
      if (deltaX > 40 && currentIndex > 0) {
        goToPage(currentIndex - 1);
      }
    }, { passive: true });

    unlockButton.addEventListener("click", () => {

      updateBook();
      syncEditorFields();

      updateBook();
      syncEditorFields();

    });

    resetAllButton.addEventListener("click", () => {

      renderPages();
      updateBook();
      syncEditorFields();

    exportButton.addEventListener("click", async () => {

      try {
        await navigator.clipboard.writeText(payload);

      } catch {
        editorStatus.textContent = "Veriler kutuya aktarıldı. İstersen elle kopyalayabilirsin.";
      }
    });

    importButton.addEventListener("click", () => {

          note: entry.note || defaultQuotes[index]?.note || BLANK_PAGE.note

        updateBook();

    const cursorGlow = document.getElementById("cursorGlow");

    let mouseY = window.innerHeight / 2;
    
    window.addEventListener("mousemove", (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateCursor() {
      // smooth following
      let x = parseFloat(cursorGlow.style.left) || mouseX;
      let y = parseFloat(cursorGlow.style.top) || mouseY;
      x += (mouseX - x) * 0.15;
      y += (mouseY - y) * 0.15;
      cursorGlow.style.left = `${x}px`;
      cursorGlow.style.top = `${y}px`;
      requestAnimationFrame(animateCursor);
    }
    animateCursor();

    // Subtle hover effect over interactive elements
    document.querySelectorAll("button, select, input, textarea").forEach(el => {
      el.addEventListener("mouseenter", () => {
        cursorGlow.style.width = "500px";
        cursorGlow.style.height = "500px";
        cursorGlow.style.background = "radial-gradient(circle, rgba(142, 232, 234, 0.22) 0%, rgba(173, 124, 228, 0.12) 40%, transparent 60%)";
      });
      el.addEventListener("mouseleave", () => {
        cursorGlow.style.width = "400px";
        cursorGlow.style.height = "400px";
        cursorGlow.style.background = "radial-gradient(circle, rgba(142, 232, 234, 0.15) 0%, rgba(173, 124, 228, 0.08) 30%, transparent 60%)";
      });
    });

          introOverlay.classList.add("is-hidden");

      });

    // Rewrite createHeartRain to make it create petals instead
    const _oldHeartRain = createHeartRain;
    createHeartRain = function() {
      const heartRain = document.getElementById("heartRain");
      if(!heartRain) return;
      const heartCount = window.innerWidth < 768 ? 20 : 40;
      heartRain.innerHTML = "";

      for (let index = 0; index < heartCount; index += 1) {

        if(index % 4 === 0) shape.style.filter = "hue-rotate(-15deg)";

        heart.appendChild(shape);
        heartRain.appendChild(heart);
      }

    // Ripple Effect
    window.addEventListener("pointerdown", function(e) {
      const ripple = document.createElement("div");
      ripple.className = "ripple-effect";
      ripple.style.left = e.clientX + "px";
      ripple.style.top = e.clientY + "px";

      ripple.style.height = "40px";
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1400);
    });

    // 3D Parallax Effect
    const theBook = document.querySelector(".book");
    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;

    window.addEventListener("mousemove", (e) => {
      targetX = (window.innerWidth / 2 - e.clientX) / 45;
      targetY = (window.innerHeight / 2 - e.clientY) / 45;
    });

    function renderParallax() {
      currentX += (targetX - currentX) * 0.1;
      currentY += (targetY - currentY) * 0.1;
      
      const envelope = document.querySelector(".envelope");
      
      if(theBook) {
        theBook.style.transform = `perspective(1600px) rotateX(${-currentY}deg) rotateY(${-currentX}deg)`;
      }
      if(envelope) {
        envelope.style.transform = `perspective(1600px) rotateX(${-currentY * 1.6}deg) rotateY(${-currentX * 1.6}deg)`;
      }
      
      requestAnimationFrame(renderParallax);
    }
    renderParallax();


    // Twin Stars Logic
    const tStar1 = document.createElement("div");
    const tStar2 = document.createElement("div");
    tStar1.className = "twin-star star-1";
    tStar2.className = "twin-star star-2";
    document.body.appendChild(tStar1);
    document.body.appendChild(tStar2);

    let tAngle = 0;
    // We already have mouseX and mouseY from previous features, but let's re-declare them as global overrides safely 
    // Wait, earlier cursorGlow uses mouseX. We will just use window.globalMouseX
    window.globalMouseX = window.innerWidth / 2;
    window.globalMouseY = window.innerHeight / 2;
    
    window.addEventListener("mousemove", (e) => {
      window.globalMouseX = e.clientX;
      window.globalMouseY = e.clientY;
    });

    function animateTwinStars() {
      tAngle += 0.04;
      const radius = 35; // orbit distance
      const s1X = window.globalMouseX + Math.cos(tAngle) * radius - 7; // -7 for center of 14px 
      const s1Y = window.globalMouseY + Math.sin(tAngle) * radius - 7;
      const s2X = window.globalMouseX + Math.cos(tAngle + Math.PI) * radius - 7;
      const s2Y = window.globalMouseY + Math.sin(tAngle + Math.PI) * radius - 7;
      
      tStar1.style.transform = `translate(${s1X}px, ${s1Y}px)`;
      tStar2.style.transform = `translate(${s2X}px, ${s2Y}px)`;
      
      requestAnimationFrame(animateTwinStars);
    }
    animateTwinStars();


    // Flying Origami Cranes Logic
    function createCrane() {
      const crane = document.createElement("div");
      crane.className = "origami-crane";
      
      const scale = 0.4 + Math.random() * 0.4; // 0.4 to 0.8
      const startY = (Math.random() * window.innerHeight * 0.8) + "px";
      const endY = (Math.random() * window.innerHeight * 0.8) + "px";
      const flyDur = 15 + Math.random() * 20; // 15 to 35 seconds
      const flapDur = 0.8 + Math.random() * 0.5; // 0.8 to 1.3 seconds
      
      crane.style.setProperty("--crane-scale", scale);
      crane.style.setProperty("--start-y", startY);
      crane.style.setProperty("--end-y", endY);
      crane.style.setProperty("--fly-dur", flyDur + "s");
      crane.style.setProperty("--flap-dur", flapDur + "s");
      
      crane.style.width = "60px";
      crane.style.height = "60px";

      crane.innerHTML = `
        <svg class="crane-svg" viewBox="0 0 100 100">
          <polygon class="wing-left" points="50,40 20,10 10,40 40,60" />
          <polygon class="wing-right" points="50,40 80,10 90,40 60,60" />
          <polygon class="body" points="40,60 60,60 50,75 50,90" />
          <polygon class="tail" points="30,85 40,60 50,75" />
          <polygon class="head" points="70,25 60,60 50,50" />
        </svg>
      `;

      document.body.appendChild(crane);
      
      // Cleanup after fly animation
      setTimeout(() => crane.remove(), flyDur * 1000);
    }

    // Spawn cranes occasionally
    setInterval(() => {
      // Create a crane only sporadically (30% chance every 4 seconds) to keep it rare and magical
      if(Math.random() < 0.3) {
        createCrane();
      }
    }, 4000);
    
    // Create first crane immediately
    createCrane();


    // Focus Mode Logic
    const focusToggle = document.getElementById("focusToggle");
    let isFocused = false;
    
    focusToggle.addEventListener("click", () => {
      isFocused = !isFocused;
      if (isFocused) {
        document.body.classList.add("is-focused");
        focusToggle.textContent = "✨";
        focusToggle.title = "Karanlıktan Çık";
      } else {
        document.body.classList.remove("is-focused");
        focusToggle.textContent = "🌑";
        focusToggle.title = "Sadece Şiire Odaklan";
      }
    });
